node_id = "node-0"
listen = "127.0.0.1:7100"
admin_listen = "127.0.0.1:7101"
data_dir = "./data/node"
coord_endpoints = []
backend = "fjall"
shutdown_timeout_secs = 3600
# Rotate the WAL segment past this size. Rotation costs one storage fsync,
# and is what keeps the log from growing for the whole uptime of the node.
wal_rotate_bytes = 67108864
# Events a Watch subscriber may fall behind by before its stream is terminated
# with DataLoss. Higher is more tolerant of a slow client, at a cost in memory
# per stream.
watch_buffer = 1024
# How often an idle Watch stream emits a heartbeat, so a client can tell a quiet
# keyspace from a dead connection.
watch_heartbeat_secs = 30

# Three modes, mutually exclusive.
#   insecure = true        every caller is trusted; development only
#   public_key_path = ...  one RS256 public key, read once at startup
#   jwks_url = ...         keys fetched from an IAM and refreshed as it rotates
[auth]
insecure = true
# jwks_url = "https://idp.example/realms/ferriskv/protocol/openid-connect/certs"
# How long the node may go without re-reading the key set. A rotation is also
# picked up on demand, the first time a token names a key the node does not have.
# jwks_refresh_secs = 3600
# Permits a plaintext JWKS endpoint outside loopback. Off by default: whoever
# answers that URL decides which signatures the node accepts. Turn it on only
# where a sidecar terminates TLS.
# jwks_allow_plaintext = false

# Node-wide quota defaults, applied to any tenant without a record of its own.
# 0 means unlimited on both fields, which is the default: a node should not
# enforce a limit its operator never chose. Per-tenant overrides are set through
# the admin API (PUT /quotas/<tenant>) and persist in the tenant's metadata.
[quota]
default_max_bytes = 0
default_max_ops_per_sec = 0

[limits]
max_key_size = 4096
max_value_size = 10485760
max_batch_ops = 1000
max_scan_limit = 10000

# ./target/release/ferriskv --tenant alice put hello world --ttl-ms 5000
# ./target/release/ferriskv --tenant alice get hello
